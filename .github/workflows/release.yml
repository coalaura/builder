name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  project_name: builder

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos:
          - windows
          - linux
          - darwin
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      id: build
      uses: coalaura/build@v1
      with:
        os: ${{ matrix.goos }}
        arch: amd64
        generate: false
        output: dist/${{ env.project_name }}-${{ matrix.goos }}-amd64${{ matrix.goos == 'windows' && '.exe' || '' }}

    - name: Sign
      id: sign
      uses: coalaura/sign@v1
      with:
        path: ${{ steps.build.outputs.path }}
        key: ${{ secrets.COALAURA_PFX }}
        passphrase: ${{ secrets.COALAURA_PFX_PASSWORD }}
        chain: |
          https://wiese2.org/pki/issuing.pem
          https://wiese2.org/pki/root.pem

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: signed-${{ env.project_name }}-${{ matrix.goos }}-amd64
        path: ${{ steps.sign.outputs.path }}
        if-no-files-found: error
        retention-days: 1

  macos-sdk:
    runs-on: macos-26

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      MACOS_SDK_VERSION: '26.5'

    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
    - name: Package macOS SDK
      id: package
      shell: bash
      run: |
        set -euo pipefail

        SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"

        if [[ "$SDK_VERSION" != "$MACOS_SDK_VERSION" ]]; then
          echo "Expected macOS SDK $MACOS_SDK_VERSION, found $SDK_VERSION" >&2
          exit 1
        fi

        SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
        ARCHIVE_PATH="$RUNNER_TEMP/macos-sdk.tar.gz"

        test -d "$SDK_PATH/usr/include"
        test -f "$SDK_PATH/usr/lib/libSystem.tbd"
        test -f "$SDK_PATH/usr/lib/libresolv.tbd"
        test -d "$SDK_PATH/System/Library/Frameworks"

        COPYFILE_DISABLE=1 tar -czf "$ARCHIVE_PATH" -C "$SDK_PATH" .

        SDK_SHA256="$(shasum -a 256 "$ARCHIVE_PATH" | cut -d ' ' -f 1)"
        echo "sha256=$SDK_SHA256" >> "$GITHUB_OUTPUT"

    - name: Upload macOS SDK
      uses: actions/upload-artifact@v7
      with:
        name: macos-sdk
        path: ${{ runner.temp }}/macos-sdk.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

  container:
    needs: macos-sdk
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download macOS SDK
      uses: actions/download-artifact@v8
      with:
        name: macos-sdk
        path: ${{ runner.temp }}/macos-sdk

    - name: Prepare macOS SDK
      shell: bash
      env:
        MACOS_SDK_SHA256: ${{ needs.macos-sdk.outputs.sha256 }}
      run: |
        set -euo pipefail

        ARCHIVE_PATH="$RUNNER_TEMP/macos-sdk/macos-sdk.tar.gz"
        SDK_PATH="$RUNNER_TEMP/macos-sdk/root"

        echo "$MACOS_SDK_SHA256  $ARCHIVE_PATH" | sha256sum --check -

        mkdir -p "$SDK_PATH"
        tar -xzf "$ARCHIVE_PATH" -C "$SDK_PATH"

        test -d "$SDK_PATH/usr/include"
        test -f "$SDK_PATH/usr/lib/libSystem.tbd"
        test -f "$SDK_PATH/usr/lib/libresolv.tbd"
        test -d "$SDK_PATH/System/Library/Frameworks"

    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

    - name: Build and push images
      shell: bash
      env:
        IMAGE: coalaura/${{ env.project_name }}
      run: |
        set -euo pipefail

        standard_tags=(
          "$IMAGE:${GITHUB_REF_NAME}"
        )

        macos_tags=(
          "$IMAGE:${GITHUB_REF_NAME}-macos"
        )

        if [[ "$GITHUB_REF_NAME" != *-* ]]; then
          standard_tags+=(
            "$IMAGE:latest"
          )

          macos_tags+=(
            "$IMAGE:latest-macos"
          )
        fi

        standard_tag_args=()

        for tag in "${standard_tags[@]}"; do
          standard_tag_args+=(--tag "$tag")
        done

        macos_tag_args=()

        for tag in "${macos_tags[@]}"; do
          macos_tag_args+=(--tag "$tag")
        done

        docker build \
          --platform linux/amd64 \
          --target standard \
          --build-arg "VERSION=${GITHUB_REF_NAME}" \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          "${standard_tag_args[@]}" \
          .

        docker build \
          --platform linux/amd64 \
          --target macos \
          --build-context "macos-sdk=${RUNNER_TEMP}/macos-sdk/root" \
          --build-arg "VERSION=${GITHUB_REF_NAME}" \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          "${macos_tag_args[@]}" \
          .

        for tag in "${standard_tags[@]}"; do
          docker push "$tag"
        done

        for tag in "${macos_tags[@]}"; do
          docker push "$tag"
        done

  release:
    needs: [build, container]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
    - name: Download signed release
      uses: actions/download-artifact@v8
      with:
        pattern: signed-${{ env.project_name }}-*
        path: dist
        merge-multiple: true

    - name: Create checksums
      working-directory: dist
      run: sha256sum -b ${{ env.project_name }}-* > SHA256SUMS

    - name: Attest binaries
      uses: actions/attest@v4
      with:
        subject-checksums: dist/SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        name: "Release ${{ github.ref_name }}"
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}